<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lei</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>

<header>
  <h1>Lei</h1>
  <div class="model-controls">
    <span class="ctrl-label">Model</span>
    <select id="modelSelect" title="No models available" disabled>
      <option value="">No models available</option>
    </select>
  </div>
</header>

<div class="layout">
  <div class="chat-panel">
    <div class="messages" id="messages">
      <div class="welcome-card">
        <div class="welcome-title">Lei</div>
        <div class="welcome-sub">Hello! I'm Lei. How can I help you?</div>
      </div>
    </div>
    <div class="input-bar">
      <input id="userInput" type="text" placeholder="Ask anything…" autocomplete="off" autofocus />
      <button id="sendBtn" onclick="sendMessage()">Send</button>
      <button id="stopBtn" onclick="stopGeneration()" title="Stop generation">Stop</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
