<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lei</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>

<header>
  <h1>Lei</h1>
  <div class="model-controls">
    <span class="ctrl-label">Model</span>
    <select id="modelSelect" title="Select model"></select>
    <span id="keyBadge" class="key-badge unset">-</span>
    <div class="token-wrap" id="hfTokenWrap" style="display:none">
      <span class="ctrl-label">HF Token</span>
      <input class="token-input" id="hfTokenInput" type="password" placeholder="hf_…" autocomplete="off" />
    </div>
  </div>
</header>

<div id="modelWarning" style="display:none;background:#451a03;color:#fcd34d;font-size:11px;padding:5px 18px;flex-shrink:0;"></div>

<div id="lmsPanelWrap" style="display:none">
  <div class="lms-panel">
    <label>LM Studio URL</label>
    <input class="lms-input lms-url" id="lmsUrl" type="text" value="http://localhost:1234" />
    <label>Model</label>
    <input class="lms-input lms-model" id="lmsModel" type="text" placeholder="auto (uses loaded model)" />
    <button class="lms-probe-btn" onclick="probeLMStudio()">Check Connection</button>
    <span id="lmsStatus" class="lms-status"></span>
    <span id="lmsModelHint" class="lms-model-hint"></span>
  </div>
</div>

<div class="layout">
  <div class="chat-panel">
    <div class="messages" id="messages">
      <div class="welcome-card">
        <div class="welcome-title">Lei</div>
        <div class="welcome-sub">An AI reasoning agent. Ask me anything.</div>
        <div class="welcome-suggestions">
          <button class="suggest-btn" onclick="fillInput('Build a REST API in Python')">Build a REST API in Python</button>
          <button class="suggest-btn" onclick="fillInput('What is machine learning?')">What is machine learning?</button>
          <button class="suggest-btn" onclick="fillInput('Write a binary search algorithm')">Write a binary search algorithm</button>
          <button class="suggest-btn" onclick="fillInput('Explain how databases work')">Explain how databases work</button>
        </div>
      </div>
    </div>
    <div class="input-bar">
      <input id="userInput" type="text" placeholder="Ask anything…" autocomplete="off" autofocus />
      <button id="sendBtn" onclick="sendMessage()">Send</button>
      <button id="stopBtn" onclick="stopGeneration()" title="Stop generation">Stop</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
